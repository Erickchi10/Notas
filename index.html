<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bloc de notas con Vue.js - Practica 5, Programacion Web, ITESCAM.">
  <meta name="author" content="Erick Chi Calan - Equipo TacoCoders">
  <title>Notas - TacoCoders</title>
  <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Todo lo que esta dentro de #app lo controla Vue -->
  <div id="app" v-cloak>

    <!-- Barra superior: usuario e idioma -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <span class="navbar-brand fw-bold">📝 Notas</span>
        <div class="d-flex align-items-center gap-2">
          <label for="usuario" class="text-white-50 small mb-0">Usuario:</label>
          <select id="usuario" class="form-select form-select-sm w-auto" v-model.number="usuarioId">
            <option v-for="u in usuarios" :key="u.id" :value="u.id">{{ u.nombre }}</option>
          </select>
          <button type="button" class="btn btn-outline-light btn-sm">EN</button>
        </div>
      </div>
    </nav>

    <main class="container py-4">

      <h1 class="display-6 fw-semibold mb-0">
        Bloc de notas sencillo <small class="text-secondary fs-4">by TacoCoders</small>
      </h1>
      <h2 class="h3 mt-3">{{ editandoId !== null ? 'Editar nota' : 'Agregar nueva nota' }}</h2>

      <!-- Formulario: v-model enlaza los campos con nuevaNota.
           novalidate: la validacion la hace Vue, no el navegador -->
      <form class="mb-4" @submit.prevent="guardarNota" novalidate>
        <label for="texto" class="form-label">Escribe una nota:</label>
        <textarea id="texto" class="form-control mb-1" rows="3"
                  :class="{ 'is-invalid': mostrarErrores }"
                  placeholder="Tu nota va aquí..." v-model="nuevaNota.texto"></textarea>

        <!-- Lista de errores de validacion -->
        <div v-if="mostrarErrores" class="invalid-feedback d-block">
          <div v-for="e in errores" :key="e">• {{ e }}</div>
        </div>

        <div class="form-text mb-3"
             :class="{ 'text-danger fw-semibold': nuevaNota.texto.length > maxCaracteres }">
          {{ nuevaNota.texto.length }} / {{ maxCaracteres }}
        </div>

        <button type="submit" class="btn btn-success mb-3 me-1">
          {{ editandoId !== null ? 'Actualizar' : 'Guardar' }}
        </button>
        <button v-if="editandoId !== null" type="button" class="btn btn-secondary mb-3"
                @click="limpiarFormulario">Cancelar</button>

        <div class="d-flex align-items-center gap-2">
          <label for="color" class="form-label mb-0">Elige un color:</label>
          <input type="color" id="color" class="form-control form-control-color" v-model="nuevaNota.color">
        </div>
      </form>

      <!-- Aviso de exito -->
      <div v-if="mensaje" class="alert alert-success py-2">{{ mensaje }}</div>

      <!-- Mensajes de carga y error -->
      <div v-if="cargando" class="text-secondary">Cargando notas...</div>
      <div v-else-if="error" class="alert alert-danger">{{ error }}</div>

      <template v-else>
        <p class="text-secondary mb-3">
          Notas de <strong>{{ usuarioActual ? usuarioActual.nombre : '' }}</strong>: {{ notasDelUsuario.length }}
        </p>

        <!-- Lista de notas del usuario elegido -->
        <div v-for="nota in notasDelUsuario" :key="nota.id"
             class="nota rounded p-4 mb-3" :class="{ 'nota-editando': nota.id === editandoId }"
             :style="{ backgroundColor: nota.color, color: colorTexto(nota.color) }">
          <h3 class="h4 mb-1">{{ nota.texto }}</h3>
          <p class="fw-semibold mb-2">{{ formatearFecha(nota.fecha) }}</p>
          <button type="button" class="btn btn-warning btn-sm me-1" @click="editarNota(nota)">Editar</button>
          <button type="button" class="btn btn-danger btn-sm" @click="borrarNota(nota)">Borrar</button>
        </div>

        <p v-if="notasDelUsuario.length === 0" class="text-secondary">Este usuario todavía no tiene notas.</p>
      </template>

    </main>

    <footer class="text-center text-secondary small py-3">
      Práctica 5 · Programación Web (AEB-1055) · ITESCAM · Equipo TacoCoders
    </footer>
  </div>

  <script src="lib/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="lib/vue/vue.global.prod.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
